name: Release container

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test -race -timeout 180s ./... && go vet ./...
        working-directory: server
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node --test tests/*.test.cjs
      - run: npm run build
        working-directory: frontend
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: movie:test
      - name: Container boot and persistence
        run: |
          set -euo pipefail
          docker run -d --name movie-test -e USER=admin -e PASSWORD=test-only-password -p 127.0.0.1:28181:8080 -v movie-test-data:/data movie:test
          trap 'docker logs movie-test; docker rm -f movie-test; docker volume rm movie-test-data' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:28181/api/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:28181/api/health | grep '0.9.0'
          test "$(docker exec movie-test awk '/^Uid:/ {print $2}' /proc/1/status)" = 10001
          docker restart movie-test
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:28181/api/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:28181/api/health | grep '0.9.0'

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: stylle/today-random-movie-web
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Publish public deployment guide
        env:
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 scripts/publish-overview.py
