services:
  movie:
    # 【源码构建必需】从当前目录构建；只拉 Docker Hub 镜像请使用 docker-compose.hub.yml。
    build:
      context: .
    image: today-random-movie:local
    container_name: today-random-movie
    restart: always
    environment:
      - USER=admin
      - PASSWORD=change-this-password
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
