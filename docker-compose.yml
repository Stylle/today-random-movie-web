services:
  movie:
    build:
      context: .
    image: today-random-movie:local
    container_name: today-random-movie
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - SETUP_TOKEN=change-this-before-starting-at-least-32-characters
      - PUBLIC_BASE_URL=http://127.0.0.1:8080
      - TRUSTED_PROXIES=
      - ALLOW_PUBLIC_FNOS=false
      - ALLOW_PRIVATE_WEBHOOKS=false
      - SESSION_HOURS=12
      - REMEMBER_DAYS=30
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
