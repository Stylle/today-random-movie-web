services:
  movie:
    # 固定版本可改成 v0.4.0。
    image: stylle/today-random-movie-web:latest
    container_name: today-random-movie
    restart: always
    environment:
      # 首次启动创建管理员；以后修改不会自动覆盖数据库。
      - USER=admin
      - PASSWORD=change-this-password
    ports:
      - "8080:8080"
    volumes:
      # 修改冒号左侧为飞牛上的实际数据目录。
      - /vol2/1000/03_Docker_Data/today-random-movie/data:/data
