services:
  movie:
    # 【无需修改】Docker Hub 镜像；需要固定版本时把 latest 改成 v0.1.0。
    image: stylle/today-random-movie-web:latest
    container_name: today-random-movie
    restart: always
    environment:
      # 【可省略】容器和默认计划任务时区；省略时默认 Asia/Shanghai。
      - TZ=Asia/Shanghai
      # 【首次部署必填】至少 32 位随机字符串。首个管理员创建成功后可删除此行。
      - SETUP_TOKEN=change-this-before-starting-at-least-32-characters
      # 【公网部署必填】站点的 HTTPS 访问地址，用于安全 Cookie 和 Webhook 中的绝对链接；仅本地使用可删除。
      - PUBLIC_BASE_URL=https://movie.example.com
      # 【使用反向代理时填写】只写实际代理来源网段；不用代理可删除，禁止填写 0.0.0.0/0。
      - TRUSTED_PROXIES=172.16.0.0/12
      # 【可省略，默认 false】飞牛地址是公网 IP/域名时才改 true。
      - ALLOW_PUBLIC_FNOS=false
      # 【可省略，默认 false】Webhook 目标位于局域网/回环地址时才改 true。
      - ALLOW_PRIVATE_WEBHOOKS=false
      # 【可省略】普通登录会话小时数；省略时为 12。
      - SESSION_HOURS=12
      # 【可省略】勾选“记住我”后的天数；省略时为 30。
      - REMEMBER_DAYS=30
    ports:
      # 【必填】默认只供同机反向代理访问；局域网直连可改为 "8080:8080"。
      - "127.0.0.1:8080:8080"
    volumes:
      # 【必填】持久化数据库、密钥和海报缓存；冒号左侧改成你的实际目录。
      - /vol2/1000/03_Docker_Data/today-random-movie/data:/data
    # 以下均为推荐安全约束，通常无需修改。
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/today-random-movie", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          # 【可选】内存限制；影片很多或同步量大时可提高。
          memory: 256M
