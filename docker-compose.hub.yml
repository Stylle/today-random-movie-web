services:
  movie:
    image: stylle/today-random-movie-web:latest
    container_name: today-random-movie
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - SETUP_TOKEN=change-this-before-starting-at-least-32-characters
      - PUBLIC_BASE_URL=https://movie.example.com
      - TRUSTED_PROXIES=172.16.0.0/12
      - ALLOW_PUBLIC_FNOS=false
      - ALLOW_PRIVATE_WEBHOOKS=false
      - SESSION_HOURS=12
      - REMEMBER_DAYS=30
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /vol2/1000/03_Docker_Data/today-random-movie/data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/today-random-movie", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
